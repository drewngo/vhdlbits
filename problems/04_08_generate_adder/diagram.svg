<polyline class="s" points="190.1,42 190.1,62"/>
<text class="t sm" x="190.1" y="33" text-anchor="middle" dominant-baseline="central">b(7)</text>
<polyline class="s" points="177.8,118 177.8,140"/>
<text class="t sm a b" x="177.8" y="150" text-anchor="middle" dominant-baseline="central">sum(7)</text>
<polyline class="s dash" points="305.8,90 214.8,90"/>
<polygon class="k" points="214.8,90 222.2,86.9 222.2,93.1"/>
<polyline class="s" points="140.8,90 80.8,90"/>
<text class="t sm a b" x="76.8" y="90" text-anchor="end" dominant-baseline="central">couts(7)</text>
<text class="t b m" x="323.8" y="90" text-anchor="middle" dominant-baseline="central">· · ·</text>
<rect class="s" x="432.8" y="62" width="74" height="56" rx="3"/>
<text class="t b" x="469.8" y="90" text-anchor="middle" dominant-baseline="central">FA1</text>
<polyline class="s" points="457.5,24 457.5,62"/>
<text class="t sm" x="457.5" y="15" text-anchor="middle" dominant-baseline="central">a(1)</text>
<polyline class="s" points="482.1,42 482.1,62"/>
<text class="t sm" x="482.1" y="33" text-anchor="middle" dominant-baseline="central">b(1)</text>
<polyline class="s" points="469.8,118 469.8,140"/>
<text class="t sm a b" x="469.8" y="150" text-anchor="middle" dominant-baseline="central">sum(1)</text>
<polyline class="s" points="578.8,90 506.8,90"/>
<polygon class="k" points="506.8,90 514.2,86.9 514.2,93.1"/>
