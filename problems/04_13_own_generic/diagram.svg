<svg xmlns="http://www.w3.org/2000/svg" width="303.2" height="136" viewBox="0 0 303.2 136" role="img">
<title>rotate left by one: the MSB wraps around to bit 0</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<text class="t" x="39.2" y="33" text-anchor="end" dominant-baseline="central">din</text>
<rect class="s bg" x="49.2" y="18" width="60" height="30"/>
<text class="t sm" x="79.2" y="33" text-anchor="middle" dominant-baseline="central">din(W-1)</text>
<rect class="s bg" x="109.2" y="18" width="180" height="30"/>
<text class="t" x="199.2" y="33" text-anchor="middle" dominant-baseline="central">din(W-2 downto 0)</text>
<text class="t" x="39.2" y="113" text-anchor="end" dominant-baseline="central">dout</text>
<rect class="s af" x="49.2" y="98" width="180" height="30"/>
<text class="t" x="139.2" y="113" text-anchor="middle" dominant-baseline="central">din(W-2 downto 0)</text>
<rect class="s af" x="229.2" y="98" width="60" height="30"/>
<text class="t sm" x="259.2" y="113" text-anchor="middle" dominant-baseline="central">din(W-1)</text>
<polyline class="s thin ms" points="79.2,48 259.2,98"/>
<polygon class="k" points="259.2,98 251.3,99 252.9,93"/>
<polyline class="s thin ms" points="199.2,48 139.2,98"/>
<polygon class="k" points="139.2,98 142.9,90.9 146.9,95.7"/>
</svg>
