<rect class="s" x="230" y="30" width="60" height="70" rx="3"/>
<text class="t sm b" x="260" y="43" text-anchor="middle" dominant-baseline="central">dff8</text>
<text class="t sm m" x="235" y="61.5" text-anchor="start" dominant-baseline="central">d</text>
<polyline class="s" points="230,80 239,86 230,92"/>
<text class="t sm m" x="285" y="61.5" text-anchor="end" dominant-baseline="central">q</text>
<rect class="s" x="350" y="30" width="60" height="70" rx="3"/>
<text class="t sm b" x="380" y="43" text-anchor="middle" dominant-baseline="central">dff8</text>
<text class="t sm m" x="355" y="61.5" text-anchor="start" dominant-baseline="central">d</text>
<polyline class="s" points="350,80 359,86 350,92"/>
<text class="t sm m" x="405" y="61.5" text-anchor="end" dominant-baseline="central">q</text>
<polyline class="s bus" points="40,61.5 110,61.5"/>
<text class="t" x="34" y="61.5" text-anchor="end" dominant-baseline="central">d</text>
<polyline class="s bus" points="170,61.5 230,61.5"/>
<polyline class="s bus" points="290,61.5 350,61.5"/>
<polyline class="s" points="40,118 336,118"/>
