# Build the grader image, optionally run the reference self-test in it, and push it.
substitutions:
  _IMAGE: ""
  _SELFTEST: ""
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "grader/Dockerfile", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["-c", "[ -z \"${_SELFTEST}\" ] || docker run --rm ${_IMAGE} bash -c 'ghdl --version | head -1 && python3 check.py --selftest ${_SELFTEST}'"]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
