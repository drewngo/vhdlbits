<polyline class="s" points="700,98.8 716,98.8 716,30 40,30 40,98.8 130,98.8"/>
<polyline class="s" points="180,98.8 260,98.8"/>
<path class="s" d="M353,78.8 Q368.6,78.8 379,98.8 Q368.6,118.8 353,118.8 Q359.5,98.8 353,78.8 Z"/>
<path class="s" d="M346,78.8 Q352.5,98.8 346,118.8"/>
<polyline class="s" points="310,98.8 334,98.8 334,108.8 348.4,108.8"/>
<polyline class="s" points="343,30 343,88.8 348.4,88.8"/>
<circle class="k" cx="343" cy="30" r="3"/>
<polyline class="s" points="379,98.8 390,98.8"/>
<polyline class="s" points="440,98.8 520,98.8"/>
<polyline class="s" points="570,98.8 650,98.8"/>
<text class="t sm m" x="365" y="182" text-anchor="middle" dominant-baseline="central">shifts right; q(0) feeds the MSB and every XOR tap</text>
