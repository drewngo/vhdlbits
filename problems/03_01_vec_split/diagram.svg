<svg xmlns="http://www.w3.org/2000/svg" width="300" height="140" viewBox="0 0 300 140" role="img">
<title>v passes to outv and splits into o2, o1, o0</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<polyline class="s bus" points="50,30 230,30"/>
<text class="t sm m" x="135" y="18" text-anchor="middle" dominant-baseline="central">3</text>
<line class="s" x1="130" y1="24" x2="140" y2="36"/>
<text class="t" x="44" y="30" text-anchor="end" dominant-baseline="central">v</text>
<text class="t a b" x="236" y="30" text-anchor="start" dominant-baseline="central">outv</text>
<circle class="k" cx="90" cy="30" r="3"/>
<polyline class="s" points="90,30 90,65 230,65"/>
<text class="t sm m" x="110" y="57" text-anchor="start" dominant-baseline="central">v(2)</text>
<text class="t a b" x="236" y="65" text-anchor="start" dominant-baseline="central">o2</text>
<polyline class="s" points="90,30 90,90 230,90"/>
<text class="t sm m" x="110" y="82" text-anchor="start" dominant-baseline="central">v(1)</text>
<text class="t a b" x="236" y="90" text-anchor="start" dominant-baseline="central">o1</text>
<polyline class="s" points="90,30 90,115 230,115"/>
<text class="t sm m" x="110" y="107" text-anchor="start" dominant-baseline="central">v(0)</text>
<text class="t a b" x="236" y="115" text-anchor="start" dominant-baseline="central">o0</text>
</svg>
