<svg xmlns="http://www.w3.org/2000/svg" width="492.4" height="56" viewBox="0 0 492.4 56" role="img">
<title>din holds 256 four-bit values; value i is din(4*i+3 downto 4*i)</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
