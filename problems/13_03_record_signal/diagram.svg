<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img">
<title>two pipeline stages, each a pkt_t record holding valid, addr and data</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<rect class="s" x="170" y="30" width="90" height="130" rx="3"/>
<text class="t b" x="215" y="46" text-anchor="middle" dominant-baseline="central">stage 1</text>
<text class="t sm m" x="175" y="75.5" text-anchor="start" dominant-baseline="central">valid</text>
<text class="t sm m" x="175" y="101.5" text-anchor="start" dominant-baseline="central">addr</text>
<text class="t sm m" x="175" y="127.5" text-anchor="start" dominant-baseline="central">data</text>
<text class="t sm m" x="255" y="75.5" text-anchor="end" dominant-baseline="central">valid</text>
<text class="t sm m" x="255" y="101.5" text-anchor="end" dominant-baseline="central">addr</text>
<text class="t sm m" x="255" y="127.5" text-anchor="end" dominant-baseline="central">data</text>
<polyline class="s" points="170,150 179,155 170,160"/>
<rect class="s" x="330" y="30" width="90" height="130" rx="3"/>
<text class="t b" x="375" y="46" text-anchor="middle" dominant-baseline="central">stage 2</text>
<text class="t sm m" x="335" y="75.5" text-anchor="start" dominant-baseline="central">valid</text>
<text class="t sm m" x="335" y="101.5" text-anchor="start" dominant-baseline="central">addr</text>
<text class="t sm m" x="335" y="127.5" text-anchor="start" dominant-baseline="central">data</text>
<text class="t sm m" x="415" y="75.5" text-anchor="end" dominant-baseline="central">valid</text>
<text class="t sm m" x="415" y="101.5" text-anchor="end" dominant-baseline="central">addr</text>
<text class="t sm m" x="415" y="127.5" text-anchor="end" dominant-baseline="central">data</text>
<polyline class="s" points="330,150 339,155 330,160"/>
<polyline class="s" points="80,75.5 170,75.5"/>
<text class="t" x="74" y="75.5" text-anchor="end" dominant-baseline="central">v_in</text>
<polyline class="s" points="260,75.5 330,75.5"/>
<polyline class="s" points="420,75.5 490,75.5"/>
<text class="t a b" x="496" y="75.5" text-anchor="start" dominant-baseline="central">v_out</text>
<polyline class="s bus" points="80,101.5 170,101.5"/>
<text class="t" x="74" y="101.5" text-anchor="end" dominant-baseline="central">a_in</text>
<polyline class="s bus" points="260,101.5 330,101.5"/>
<polyline class="s bus" points="420,101.5 490,101.5"/>
<text class="t a b" x="496" y="101.5" text-anchor="start" dominant-baseline="central">a_out</text>
<polyline class="s bus" points="80,127.5 170,127.5"/>
<text class="t" x="74" y="127.5" text-anchor="end" dominant-baseline="central">d_in</text>
<polyline class="s bus" points="260,127.5 330,127.5"/>
<polyline class="s bus" points="420,127.5 490,127.5"/>
<text class="t a b" x="496" y="127.5" text-anchor="start" dominant-baseline="central">d_out</text>
<text class="t sm m" x="295" y="186" text-anchor="middle" dominant-baseline="central">each stage is one signal of type pkt_t</text>
</svg>
