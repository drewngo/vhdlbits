<svg xmlns="http://www.w3.org/2000/svg" width="444.4" height="148" viewBox="0 0 444.4 148" role="img">
<title>shift right by one with a 0 shifted in</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<text class="t" x="54.8" y="33" text-anchor="end" dominant-baseline="central">q</text>
<rect class="s bg" x="64.8" y="18" width="48" height="30"/>
<text class="t" x="88.8" y="33" text-anchor="middle" dominant-baseline="central">q(3)</text>
<text class="t sm m" x="88.8" y="11" text-anchor="middle" dominant-baseline="central">3</text>
<rect class="s bg" x="112.8" y="18" width="48" height="30"/>
<text class="t" x="136.8" y="33" text-anchor="middle" dominant-baseline="central">q(2)</text>
<text class="t sm m" x="136.8" y="11" text-anchor="middle" dominant-baseline="central">2</text>
<rect class="s bg" x="160.8" y="18" width="48" height="30"/>
<text class="t" x="184.8" y="33" text-anchor="middle" dominant-baseline="central">q(1)</text>
<text class="t sm m" x="184.8" y="11" text-anchor="middle" dominant-baseline="central">1</text>
<rect class="s bg" x="208.8" y="18" width="48" height="30"/>
<text class="t" x="232.8" y="33" text-anchor="middle" dominant-baseline="central">q(0)</text>
<text class="t sm m" x="232.8" y="11" text-anchor="middle" dominant-baseline="central">0</text>
<text class="t" x="54.8" y="109" text-anchor="end" dominant-baseline="central">next q</text>
<rect class="s xf" x="64.8" y="94" width="48" height="30"/>
<text class="t" x="88.8" y="109" text-anchor="middle" dominant-baseline="central">0</text>
<text class="t sm m" x="88.8" y="87" text-anchor="middle" dominant-baseline="central">3</text>
<rect class="s af" x="112.8" y="94" width="48" height="30"/>
<text class="t" x="136.8" y="109" text-anchor="middle" dominant-baseline="central">q(3)</text>
<text class="t sm m" x="136.8" y="87" text-anchor="middle" dominant-baseline="central">2</text>
<rect class="s af" x="160.8" y="94" width="48" height="30"/>
<text class="t" x="184.8" y="109" text-anchor="middle" dominant-baseline="central">q(2)</text>
<text class="t sm m" x="184.8" y="87" text-anchor="middle" dominant-baseline="central">1</text>
<rect class="s af" x="208.8" y="94" width="48" height="30"/>
<text class="t" x="232.8" y="109" text-anchor="middle" dominant-baseline="central">q(1)</text>
<text class="t sm m" x="232.8" y="87" text-anchor="middle" dominant-baseline="central">0</text>
<polyline class="s thin ms" points="88.8,48 136.8,80"/>
<polygon class="k" points="136.8,80 128.9,78.5 132.4,73.3"/>
<polyline class="s thin ms" points="136.8,48 184.8,80"/>
<polygon class="k" points="184.8,80 176.9,78.5 180.4,73.3"/>
<polyline class="s thin ms" points="184.8,48 232.8,80"/>
<polygon class="k" points="232.8,80 224.9,78.5 228.4,73.3"/>
<text class="t sm m" x="64.8" y="136" text-anchor="start" dominant-baseline="central">en = 1: shift right, 0 enters at the top; q(0) falls off</text>
</svg>
