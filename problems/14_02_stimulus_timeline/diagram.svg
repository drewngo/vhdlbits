<svg xmlns="http://www.w3.org/2000/svg" width="321.8" height="108" viewBox="0 0 321.8 108" role="img">
<title>the stimulus timeline for a and b</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<text class="t sm m" x="29.8" y="18" text-anchor="middle" dominant-baseline="central">0</text>
<text class="t sm m" x="85.8" y="18" text-anchor="middle" dominant-baseline="central">10</text>
<text class="t sm m" x="141.8" y="18" text-anchor="middle" dominant-baseline="central">20</text>
<text class="t sm m" x="169.8" y="18" text-anchor="middle" dominant-baseline="central">25</text>
<text class="t sm m" x="253.8" y="18" text-anchor="middle" dominant-baseline="central">40</text>
<text class="t sm m" x="309.8" y="18" text-anchor="middle" dominant-baseline="central">50</text>
<line class="s as dash" x1="309.8" y1="22" x2="309.8" y2="86"/>
<text class="t" x="17.8" y="41" text-anchor="end" dominant-baseline="central">a</text>
<line class="s" x1="29.8" y1="50" x2="85.8" y2="50"/>
<line class="s" x1="85.8" y1="50" x2="85.8" y2="32"/>
<line class="s" x1="85.8" y1="32" x2="169.8" y2="32"/>
<line class="s" x1="169.8" y1="32" x2="169.8" y2="50"/>
<line class="s" x1="169.8" y1="50" x2="309.8" y2="50"/>
<text class="t" x="17.8" y="71" text-anchor="end" dominant-baseline="central">b</text>
<line class="s" x1="29.8" y1="80" x2="141.8" y2="80"/>
<line class="s" x1="141.8" y1="80" x2="141.8" y2="62"/>
<line class="s" x1="141.8" y1="62" x2="253.8" y2="62"/>
<line class="s" x1="253.8" y1="62" x2="253.8" y2="80"/>
<line class="s" x1="253.8" y1="80" x2="309.8" y2="80"/>
<text class="t sm m" x="29.8" y="97" text-anchor="start" dominant-baseline="central">time in ns; finish at 50 ns</text>
</svg>
