<svg xmlns="http://www.w3.org/2000/svg" width="470" height="150" viewBox="0 0 470 150" role="img">
<title>two flip-flops in series on the receiving clock</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<rect class="s thin ms dash" x="10" y="10" width="80" height="100" rx="4"/>
<text class="t sm m" x="50" y="26" text-anchor="middle" dominant-baseline="central">other</text>
<text class="t sm m" x="50" y="40" text-anchor="middle" dominant-baseline="central">clock</text>
<text class="t sm m" x="50" y="54" text-anchor="middle" dominant-baseline="central">domain</text>
<rect class="s" x="160" y="30" width="60" height="70" rx="3"/>
<text class="t sm m" x="165" y="61.5" text-anchor="start" dominant-baseline="central">d</text>
<polyline class="s" points="160,80 169,86 160,92"/>
<text class="t sm m" x="215" y="61.5" text-anchor="end" dominant-baseline="central">q</text>
<rect class="s" x="280" y="30" width="60" height="70" rx="3"/>
<text class="t sm m" x="285" y="61.5" text-anchor="start" dominant-baseline="central">d</text>
<polyline class="s" points="280,80 289,86 280,92"/>
<text class="t sm m" x="335" y="61.5" text-anchor="end" dominant-baseline="central">q</text>
<polyline class="s" points="90,61.5 160,61.5"/>
<text class="t sm" x="96" y="51.5" text-anchor="start" dominant-baseline="central">async_in</text>
<polyline class="s" points="220,61.5 280,61.5"/>
<text class="t sm m" x="250" y="51.5" text-anchor="middle" dominant-baseline="central">meta</text>
<polyline class="s" points="340,61.5 380,61.5"/>
<text class="t a b" x="384" y="61.5" text-anchor="start" dominant-baseline="central">sync_out</text>
<polyline class="s" points="140,130 266,130"/>
<text class="t sm" x="136" y="130" text-anchor="end" dominant-baseline="central">clk</text>
<polyline class="s" points="146,130 146,86 160,86"/>
<polyline class="s" points="266,130 266,86 280,86"/>
</svg>
