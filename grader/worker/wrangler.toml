# Deploy: TURNSTILE_SITEKEY=0x4AAAAAAGIRgBHobCW-y8w- python3 tools/build_static.py
#         npx wrangler deploy -c grader/worker/wrangler.toml
# Secrets (wrangler secret put): GRADER_KEY, GRADER_URL, SESSION_KEY, TURNSTILE_SECRET.
name = "vhdlbits"
main = "index.js"
compatibility_date = "2026-11-01"
routes = [{ pattern = "vhdl.drewngo.com", custom_domain = true }]
workers_dev = false

[assets]
directory = "../../build/site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

