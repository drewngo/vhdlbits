<svg xmlns="http://www.w3.org/2000/svg" width="489.4" height="228" viewBox="0 0 489.4 228" role="img">
<title>sign extension, zero extension and truncation of an 8-bit value</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<text class="t" x="47" y="33" text-anchor="end" dominant-baseline="central">din</text>
<rect class="s bg" x="57" y="18" width="18" height="30"/>
<text class="t" x="66" y="33" text-anchor="middle" dominant-baseline="central">s</text>
<text class="t sm m" x="66" y="11" text-anchor="middle" dominant-baseline="central">7</text>
<rect class="s bg" x="75" y="18" width="126" height="30"/>
<text class="t" x="138" y="33" text-anchor="middle" dominant-baseline="central">din(6:0)</text>
<text class="t sm m" x="77" y="11" text-anchor="start" dominant-baseline="central">6</text>
<text class="t sm m" x="199" y="11" text-anchor="end" dominant-baseline="central">0</text>
<text class="t" x="47" y="85" text-anchor="end" dominant-baseline="central">ext_s</text>
<rect class="s af" x="57" y="70" width="144" height="30"/>
<text class="t" x="129" y="85" text-anchor="middle" dominant-baseline="central">s s s s s s s s</text>
<text class="t sm m" x="59" y="63" text-anchor="start" dominant-baseline="central">15</text>
<text class="t sm m" x="199" y="63" text-anchor="end" dominant-baseline="central">8</text>
<rect class="s bg" x="201" y="70" width="18" height="30"/>
<text class="t" x="210" y="85" text-anchor="middle" dominant-baseline="central">s</text>
<text class="t sm m" x="210" y="63" text-anchor="middle" dominant-baseline="central">7</text>
<rect class="s bg" x="219" y="70" width="126" height="30"/>
<text class="t" x="282" y="85" text-anchor="middle" dominant-baseline="central">din(6:0)</text>
<text class="t sm m" x="221" y="63" text-anchor="start" dominant-baseline="central">6</text>
<text class="t sm m" x="343" y="63" text-anchor="end" dominant-baseline="central">0</text>
<text class="t" x="47" y="137" text-anchor="end" dominant-baseline="central">ext_u</text>
<rect class="s xf" x="57" y="122" width="144" height="30"/>
<text class="t" x="129" y="137" text-anchor="middle" dominant-baseline="central">0 0 0 0 0 0 0 0</text>
<text class="t sm m" x="59" y="115" text-anchor="start" dominant-baseline="central">15</text>
<text class="t sm m" x="199" y="115" text-anchor="end" dominant-baseline="central">8</text>
<rect class="s bg" x="201" y="122" width="18" height="30"/>
<text class="t" x="210" y="137" text-anchor="middle" dominant-baseline="central">s</text>
<text class="t sm m" x="210" y="115" text-anchor="middle" dominant-baseline="central">7</text>
<rect class="s bg" x="219" y="122" width="126" height="30"/>
<text class="t" x="282" y="137" text-anchor="middle" dominant-baseline="central">din(6:0)</text>
<text class="t sm m" x="221" y="115" text-anchor="start" dominant-baseline="central">6</text>
<text class="t sm m" x="343" y="115" text-anchor="end" dominant-baseline="central">0</text>
<text class="t" x="47" y="189" text-anchor="end" dominant-baseline="central">trunc</text>
<rect class="s bg" x="57" y="174" width="72" height="30"/>
<text class="t sm" x="93" y="189" text-anchor="middle" dominant-baseline="central">din(3:0)</text>
<text class="t sm m" x="59" y="167" text-anchor="start" dominant-baseline="central">3</text>
<text class="t sm m" x="127" y="167" text-anchor="end" dominant-baseline="central">0</text>
<text class="t sm m" x="57" y="216" text-anchor="start" dominant-baseline="central">s = din(7). resize copies it on signed, fills with 0 on unsigned</text>
</svg>
