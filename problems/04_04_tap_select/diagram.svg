<text class="t sm m" x="455" y="205" text-anchor="start" dominant-baseline="central">1</text>
<text class="t sm m" x="455" y="225" text-anchor="start" dominant-baseline="central">0</text>
<polyline class="s bus" points="410,61.5 420,61.5"/>
<polyline class="s bus" points="70,61.5 70,225 450,225"/>
