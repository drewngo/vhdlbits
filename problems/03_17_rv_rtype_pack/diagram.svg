<text class="t" x="116.5" y="33" text-anchor="middle" dominant-baseline="central">funct7</text>
<text class="t sm m" x="59" y="11" text-anchor="start" dominant-baseline="central">31</text>
<text class="t sm m" x="174" y="11" text-anchor="end" dominant-baseline="central">25</text>
