<svg xmlns="http://www.w3.org/2000/svg" width="380" height="170" viewBox="0 0 380 170" role="img">
<title>a xor b drives y_conc and y_comb directly, and y_ff through a flip-flop</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<path class="s" d="M77,30 Q104.6,30 123,50 Q104.6,70 77,70 Q88.5,50 77,30 Z"/>
<path class="s" d="M70,30 Q81.5,50 70,70"/>
<polyline class="s" points="30,40 74.3,40"/>
<text class="t" x="24" y="40" text-anchor="end" dominant-baseline="central">a</text>
<polyline class="s" points="30,60 74.3,60"/>
<text class="t" x="24" y="60" text-anchor="end" dominant-baseline="central">b</text>
<polyline class="s" points="123,50 320,50"/>
<text class="t a b" x="326" y="50" text-anchor="start" dominant-baseline="central">y_conc</text>
<circle class="k" cx="150" cy="50" r="3"/>
<polyline class="s" points="150,50 150,80 320,80"/>
<text class="t a b" x="326" y="80" text-anchor="start" dominant-baseline="central">y_comb</text>
<circle class="k" cx="150" cy="80" r="3"/>
<rect class="s" x="210" y="88.5" width="50" height="60" rx="3"/>
<text class="t sm m" x="215" y="115.5" text-anchor="start" dominant-baseline="central">d</text>
<polyline class="s" points="210,130.5 219,136.5 210,142.5"/>
<text class="t sm m" x="255" y="115.5" text-anchor="end" dominant-baseline="central">q</text>
<polyline class="s" points="150,80 150,115.5 210,115.5"/>
<polyline class="s" points="260,115.5 320,115.5"/>
<text class="t a b" x="326" y="115.5" text-anchor="start" dominant-baseline="central">y_ff</text>
<polyline class="s" points="30,136.5 210,136.5"/>
<text class="t" x="24" y="136.5" text-anchor="end" dominant-baseline="central">clk</text>
</svg>
