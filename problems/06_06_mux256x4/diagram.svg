.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<text class="t" x="31.4" y="33" text-anchor="end" dominant-baseline="central">din</text>
<rect class="s af" x="41.4" y="18" width="76" height="30"/>
<text class="t sm" x="79.4" y="33" text-anchor="middle" dominant-baseline="central">value 255</text>
<text class="t sm m" x="43.4" y="11" text-anchor="start" dominant-baseline="central">1023</text>
<text class="t sm m" x="115.4" y="11" text-anchor="end" dominant-baseline="central">1020</text>
<rect class="s bg" x="117.4" y="18" width="76" height="30"/>
<text class="t sm" x="155.4" y="33" text-anchor="middle" dominant-baseline="central">value 254</text>
<text class="t sm m" x="119.4" y="11" text-anchor="start" dominant-baseline="central">1019</text>
<text class="t sm m" x="191.4" y="11" text-anchor="end" dominant-baseline="central">1016</text>
<rect class="s bg" x="193.4" y="18" width="133" height="30"/>
<text class="t" x="259.9" y="33" text-anchor="middle" dominant-baseline="central">· · ·</text>
