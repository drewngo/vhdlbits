<svg xmlns="http://www.w3.org/2000/svg" width="240" height="100" viewBox="0 0 240 100" role="img">
<title>tri-state buffer: y = a when en = 1, otherwise Z</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<polygon class="s" points="100,26 100,54 128,40"/>
<polyline class="s" points="50,40 100,40"/>
<text class="t" x="44" y="40" text-anchor="end" dominant-baseline="central">a</text>
<polyline class="s" points="114,47 114,80"/>
<text class="t" x="114" y="91" text-anchor="middle" dominant-baseline="central">en</text>
<polyline class="s" points="128,40 190,40"/>
<text class="t a b" x="196" y="40" text-anchor="start" dominant-baseline="central">y</text>
</svg>
