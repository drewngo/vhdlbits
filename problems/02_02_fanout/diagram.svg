<svg xmlns="http://www.w3.org/2000/svg" width="230" height="150" viewBox="0 0 230 150" role="img">
<title>c drives p, a drives q and r, b drives s</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<polyline class="s" points="40,25 180,25"/>
<text class="t" x="34" y="25" text-anchor="end" dominant-baseline="central">c</text>
<polyline class="s" points="40,70 100,70"/>
<text class="t" x="34" y="70" text-anchor="end" dominant-baseline="central">a</text>
<polyline class="s" points="100,55 100,85"/>
<polyline class="s" points="100,55 180,55"/>
<polyline class="s" points="100,85 180,85"/>
<circle class="k" cx="100" cy="70" r="3"/>
<polyline class="s" points="40,120 180,120"/>
<text class="t" x="34" y="120" text-anchor="end" dominant-baseline="central">b</text>
<text class="t a b" x="186" y="25" text-anchor="start" dominant-baseline="central">p</text>
<text class="t a b" x="186" y="55" text-anchor="start" dominant-baseline="central">q</text>
<text class="t a b" x="186" y="85" text-anchor="start" dominant-baseline="central">r</text>
<text class="t a b" x="186" y="120" text-anchor="start" dominant-baseline="central">s</text>
</svg>
