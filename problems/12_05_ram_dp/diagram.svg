<svg xmlns="http://www.w3.org/2000/svg" width="460" height="170" viewBox="0 0 460 170" role="img">
<title>simple dual-port RAM: one write port and one read port, both clocked</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<rect class="s" x="150" y="20" width="190" height="130" rx="3"/>
<text class="t b" x="245" y="60" text-anchor="middle" dominant-baseline="central">ram</text>
<text class="t b" x="245" y="76" text-anchor="middle" dominant-baseline="central">64 × 16</text>
<text class="t sm m" x="155" y="46" text-anchor="start" dominant-baseline="central">we</text>
<text class="t sm m" x="155" y="72" text-anchor="start" dominant-baseline="central">waddr</text>
<text class="t sm m" x="155" y="98" text-anchor="start" dominant-baseline="central">din</text>
<polyline class="s" points="150,124.5 159,130.5 150,136.5"/>
<text class="t sm m" x="335" y="85" text-anchor="end" dominant-baseline="central">dout</text>
<text class="t sm m" x="140" y="12" text-anchor="end" dominant-baseline="central">write port</text>
<polyline class="s" points="70,46 150,46"/>
<text class="t" x="64" y="46" text-anchor="end" dominant-baseline="central">we</text>
<polyline class="s bus" points="70,72 150,72"/>
<text class="t" x="64" y="72" text-anchor="end" dominant-baseline="central">waddr</text>
<polyline class="s bus" points="70,98 150,98"/>
<text class="t" x="64" y="98" text-anchor="end" dominant-baseline="central">din</text>
<polyline class="s" points="70,130.5 150,130.5"/>
<text class="t" x="64" y="130.5" text-anchor="end" dominant-baseline="central">clk</text>
<polyline class="s bus" points="245,170 245,150"/>
<text class="t sm" x="253" y="162" text-anchor="start" dominant-baseline="central">raddr</text>
<polyline class="s bus" points="340,85 400,85"/>
<text class="t a b" x="406" y="85" text-anchor="start" dominant-baseline="central">dout</text>
<text class="t sm m" x="350" y="112" text-anchor="start" dominant-baseline="central">read port</text>
</svg>
