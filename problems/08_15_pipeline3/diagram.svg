<svg xmlns="http://www.w3.org/2000/svg" width="560" height="215" viewBox="0 0 560 215" role="img">
<title>a two-stage pipeline: register after the add and after the multiply</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<circle class="s" cx="130" cy="60" r="18"/>
<text class="t b" x="130" y="60" text-anchor="middle" dominant-baseline="central">+</text>
<polyline class="s bus" points="40,50 114,50"/>
<text class="t" x="34" y="50" text-anchor="end" dominant-baseline="central">a</text>
<polyline class="s bus" points="40,70 114,70"/>
<text class="t" x="34" y="70" text-anchor="end" dominant-baseline="central">b</text>
<rect class="s" x="180" y="28.5" width="64" height="70" rx="3"/>
<text class="t sm b" x="212" y="41.5" text-anchor="middle" dominant-baseline="central">stage 1</text>
<text class="t sm m" x="185" y="60" text-anchor="start" dominant-baseline="central">d</text>
<polyline class="s" points="180,78.5 189,84.5 180,90.5"/>
<text class="t sm m" x="239" y="60" text-anchor="end" dominant-baseline="central">q</text>
<polyline class="s bus" points="148,60 180,60"/>
<rect class="s" x="180" y="118.5" width="64" height="70" rx="3"/>
<text class="t sm m" x="185" y="150" text-anchor="start" dominant-baseline="central">d</text>
<polyline class="s" points="180,168.5 189,174.5 180,180.5"/>
<text class="t sm m" x="239" y="150" text-anchor="end" dominant-baseline="central">q</text>
<polyline class="s bus" points="40,150 180,150"/>
<text class="t" x="34" y="150" text-anchor="end" dominant-baseline="central">c</text>
<circle class="s" cx="310" cy="95" r="18"/>
<text class="t b" x="310" y="95" text-anchor="middle" dominant-baseline="central">×</text>
<polyline class="s bus" points="244,60 272,60 272,88 293,88"/>
<polyline class="s bus" points="244,150 272,150 272,102 293,102"/>
<text class="t sm m" x="258" y="172" text-anchor="start" dominant-baseline="central">c delayed to match</text>
<rect class="s" x="370" y="63.5" width="64" height="70" rx="3"/>
<text class="t sm b" x="402" y="76.5" text-anchor="middle" dominant-baseline="central">stage 2</text>
<text class="t sm m" x="375" y="95" text-anchor="start" dominant-baseline="central">d</text>
<polyline class="s" points="370,113.5 379,119.5 370,125.5"/>
<text class="t sm m" x="429" y="95" text-anchor="end" dominant-baseline="central">q</text>
<polyline class="s bus" points="328,95 370,95"/>
<polyline class="s bus" points="434,95 500,95"/>
<text class="t a b" x="506" y="95" text-anchor="start" dominant-baseline="central">y</text>
<text class="t sm m" x="280" y="204" text-anchor="middle" dominant-baseline="central">clk and reset go to every register</text>
</svg>
