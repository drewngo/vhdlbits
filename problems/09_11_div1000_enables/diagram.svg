<svg xmlns="http://www.w3.org/2000/svg" width="650" height="220" viewBox="0 0 650 220" role="img">
<title>three cascaded decade counters; each stage is enabled when all lower stages are at 9</title>
<style>
.s{stroke:#1d2125;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1}
.bus{stroke-width:3.5}
.dash{stroke-dasharray:4 4}
.t{fill:#1d2125;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sm{font-size:11px}
.b{font-weight:700}
.m{fill:#6b7280}
.ms{stroke:#9aa0a8}
.a{fill:#2a5db0}
.as{stroke:#2a5db0}
.af{fill:#dbe6f7}
.bg{fill:#ffffff}
.xf{fill:#e5e7eb}
.k{fill:#1d2125}
.ak{fill:#2a5db0}
@media (prefers-color-scheme:dark){
.s{stroke:#e4e6e9}.t{fill:#e4e6e9}.m{fill:#9aa0a8}.ms{stroke:#6b7280}
.a{fill:#7aa7ff}.as{stroke:#7aa7ff}.af{fill:#2c3a52}.bg{fill:#17191c}
.xf{fill:#3a3f46}.k{fill:#e4e6e9}.ak{fill:#7aa7ff}}
</style>
<rect class="s" x="90" y="40" width="90" height="70" rx="3"/>
<text class="t b" x="135" y="56" text-anchor="middle" dominant-baseline="central">c0</text>
<text class="t sm m" x="95" y="85.5" text-anchor="start" dominant-baseline="central">en</text>
<text class="t sm m" x="175" y="85.5" text-anchor="end" dominant-baseline="central">=9</text>
<rect class="s" x="270" y="40" width="90" height="70" rx="3"/>
<text class="t b" x="315" y="56" text-anchor="middle" dominant-baseline="central">c1</text>
<text class="t sm m" x="275" y="85.5" text-anchor="start" dominant-baseline="central">en</text>
<text class="t sm m" x="355" y="85.5" text-anchor="end" dominant-baseline="central">=9</text>
<rect class="s" x="450" y="40" width="90" height="70" rx="3"/>
<text class="t b" x="495" y="56" text-anchor="middle" dominant-baseline="central">c2</text>
<text class="t sm m" x="455" y="85.5" text-anchor="start" dominant-baseline="central">en</text>
<text class="t sm m" x="535" y="85.5" text-anchor="end" dominant-baseline="central">=9</text>
<text class="t sm m" x="135" y="76" text-anchor="middle" dominant-baseline="central">0 to 9</text>
<text class="t sm m" x="315" y="76" text-anchor="middle" dominant-baseline="central">0 to 9</text>
<text class="t sm m" x="495" y="76" text-anchor="middle" dominant-baseline="central">0 to 9</text>
<polyline class="s" points="30,85.5 90,85.5"/>
<text class="t sm" x="26" y="85.5" text-anchor="end" dominant-baseline="central">&#x27;1&#x27;</text>
<text class="t sm a" x="60" y="73.5" text-anchor="middle" dominant-baseline="central">enables(0)</text>
<polyline class="s" points="180,85.5 270,85.5"/>
<text class="t sm a" x="225" y="73.5" text-anchor="middle" dominant-baseline="central">enables(1)</text>
<path class="s" d="M390,150 H416 A20,20 0 0 1 416,190 H390 Z"/>
<circle class="k" cx="200" cy="85.5" r="3"/>
<polyline class="s" points="200,85.5 200,180 390,180"/>
<polyline class="s" points="360,85.5 375,85.5 375,160 390,160"/>
<polyline class="s" points="436,170 440,170 440,85.5 450,85.5"/>
<text class="t sm a" x="440" y="205" text-anchor="middle" dominant-baseline="central">enables(2)</text>
<path class="s" d="M570,150 H596 A20,20 0 0 1 596,190 H570 Z"/>
<circle class="k" cx="440" cy="170" r="3"/>
<polyline class="s" points="440,170 440,180 570,180"/>
<polyline class="s" points="540,85.5 555,85.5 555,160 570,160"/>
<polyline class="s" points="616,170 640,170"/>
<text class="t sm a b" x="640" y="158" text-anchor="end" dominant-baseline="central">tick</text>
</svg>
