<text class="t sm m" x="259" y="11" text-anchor="end" dominant-baseline="central">20</text>
<rect class="s bg" x="261" y="18" width="85" height="30"/>
<text class="t" x="303.5" y="33" text-anchor="middle" dominant-baseline="central">rs1</text>
<text class="t sm m" x="263" y="11" text-anchor="start" dominant-baseline="central">19</text>
<text class="t sm m" x="344" y="11" text-anchor="end" dominant-baseline="central">15</text>
